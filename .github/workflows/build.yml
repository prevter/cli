name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      debug:
        description: enable tmate debug
        default: false
        type: boolean
  push:
    paths:
    - "src/**"
    - "Cargo.toml"
    - "build.rs"
    - ".github/workflows/build.yml"
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "Windows"
          id: win
          os: ubuntu-latest
          executable: 'geode.exe'
          prebuild: 'sudo apt-get install gcc-mingw-w64-x86-64'
          target: x86_64-pc-windows-gnu

        - name: "Linux"
          id: linux
          os: ubuntu-22.04
          # ubuntu-latest is currently a mix of 22.04 and 24.04
          # so we are not able to use that until January 17, 2025 at least
          # if we want compatibility with said version on GH actions
          # see also https://github.com/actions/runner-images/issues/10636
          executable: 'geode'
          # some stupid old ubuntu versions cant install libssl3
          prebuild: 'export OPENSSL_STATIC=1'
          target: x86_64-unknown-linux-gnu

        - name: "Linux ARM64"
          id: linux-arm
          os: ubuntu-22.04-arm
          executable: 'geode'
          prebuild: 'export OPENSSL_STATIC=1'
          target: aarch64-unknown-linux-gnu

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{ matrix.config.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.config.id }}

    - name: Build
      run: |
        ${{ matrix.config.prebuild }}
        cargo build --release --target ${{ matrix.config.target }}

    - name: Move to output folder
      shell: bash
      run: |
        mkdir ./out
        mv ./target/${{ matrix.config.target }}/release/${{ matrix.config.executable }} ./out

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: geode-cli-${{ matrix.config.id }}
        path: ./out/

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Install x86_64 Homebrew
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install x86_64 OpenSSL
        run: |
          arch -x86_64 /usr/local/bin/brew install openssl@3
          echo "OPENSSL_ROOT_DIR=/usr/local/opt/openssl@3" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/local/opt/openssl@3/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/opt/openssl@3/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install arm64 OpenSSL
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/opt/homebrew/opt/openssl@3/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build x86_64
        run: |
          export OPENSSL_STATIC=1
          export MACOSX_DEPLOYMENT_TARGET=11.0
          cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64
        run: |
          export OPENSSL_STATIC=1
          export MACOSX_DEPLOYMENT_TARGET=11.0
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p ./out
          lipo -create \
            target/x86_64-apple-darwin/release/geode \
            target/aarch64-apple-darwin/release/geode \
            -output ./out/geode
          chmod +x ./out/geode
          lipo -info ./out/geode

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geode-cli-mac
          path: ./out/

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build, build-macos]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Declare Version Variables
      id: ref
      run: |
        echo "version=$(cat VERSION | xargs)" >> $GITHUB_OUTPUT
        echo "hash=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_OUTPUT

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{ github.workspace }}/artifacts

    # TODO: change when this is fixed https://github.com/actions/download-artifact/issues/143

    - name: Zip Windows Artifacts
      uses: vimtor/action-zip@v1.2
      with:
        files: artifacts/geode-cli-win/geode.exe
        dest: artifacts/geode-cli-${{ steps.ref.outputs.hash }}-win.zip

    - name: Zip macOS Artifacts
      uses: vimtor/action-zip@v1.2
      with:
        files: artifacts/geode-cli-mac/geode
        dest: artifacts/geode-cli-${{ steps.ref.outputs.hash }}-mac.zip

    - name: Zip Linux Artifacts
      uses: vimtor/action-zip@v1.2
      with:
        files: artifacts/geode-cli-linux/geode
        dest: artifacts/geode-cli-${{ steps.ref.outputs.hash }}-linux.zip

    - name: Zip Linux ARM Artifacts
      uses: vimtor/action-zip@v1.2
      with:
        files: artifacts/geode-cli-linux-arm/geode
        dest: artifacts/geode-cli-${{ steps.ref.outputs.hash }}-linux-arm.zip

    - name: Update Development Release
      uses: andelf/nightly-release@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: nightly
        name: 'Development Release'
        body: Geode CLI development release for commit ${{ github.sha }}.
        files: |
          ./artifacts/*.zip
